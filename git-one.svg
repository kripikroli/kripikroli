<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="600" viewBox="0 0 900 600" fill="none"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     role="img" aria-label="Welcome to my profile! Life is good, you should Git one! Thinking AI agents. Skills: AWS, AI, Kiro, Python, TypeScript, Databases">
  <title>Welcome to my profile! Life is good, you should Git one!</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="35%"  stop-color="#818cf8"/>
      <stop offset="70%"  stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fb923c"/>
      <animate attributeName="x1" values="0;-0.6;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.6;1"  dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="subline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="chipglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="neon" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Pixel-bot agent (drawn from unit squares, ~28px tall). fill via currentColor -->
    <g id="bot">
      <!-- head dome -->
      <rect x="6"  y="0"  width="16" height="4"/>
      <rect x="2"  y="4"  width="24" height="4"/>
      <rect x="0"  y="8"  width="28" height="12"/>
      <!-- eyes (knockout) -->
      <rect x="6"  y="11" width="5"  height="6" fill="#0b1120"/>
      <rect x="17" y="11" width="5"  height="6" fill="#0b1120"/>
      <!-- jaw / legs -->
      <rect x="2"  y="20" width="24" height="4"/>
      <rect x="4"  y="24" width="5"  height="4"/>
      <rect x="12" y="24" width="4"  height="4"/>
      <rect x="19" y="24" width="5"  height="4"/>
    </g>
  </defs>

  <style>
    .eyebrow  { font: 700 20px 'Segoe UI','Helvetica Neue',Arial,sans-serif; letter-spacing:2px; }
    .headline { font: 800 46px 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .sub      { font: 700 30px 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .label    { font: 600 13px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill:#cbd5e1; }
    .status   { font: 600 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill:#94a3b8; letter-spacing:.5px; }
    .ts       { font: 800 32px 'Segoe UI',Arial,sans-serif; fill:#ffffff; }
    .aws      { font: 800 24px 'Segoe UI',Arial,sans-serif; }
    .kiro     { font: 800 44px 'Segoe UI',Arial,sans-serif; fill:#c4b5fd; }

    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

    .breathe { animation: breathe 3.2s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:.55} 50%{opacity:1} }

    /* float applied to inner group so outer translate is preserved */
    .float { animation: float 4s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .d1{animation-delay:0s}.d2{animation-delay:.35s}.d3{animation-delay:.7s}
    .d4{animation-delay:1.05s}.d5{animation-delay:1.4s}.d6{animation-delay:1.75s}

    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.85} 50%{opacity:1} }

    /* Agents drifting left-right, staggered, different ranges */
    .agent { animation: drift 5s ease-in-out infinite; }
    @keyframes drift { 0%,100%{transform:translateX(-10px)} 50%{transform:translateX(10px)} }
    .a1{animation-delay:0s;animation-duration:5.2s}
    .a2{animation-delay:.6s;animation-duration:4.4s;animation-direction:reverse}
    .a3{animation-delay:.3s;animation-duration:6s}
    .a4{animation-delay:.9s;animation-duration:4.8s;animation-direction:reverse}
    .a5{animation-delay:.2s;animation-duration:5.6s}

    .bob { animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  </style>

  <rect width="900" height="540" rx="28" fill="url(#bg)"/>

  <circle cx="120" cy="70"  r="90" fill="#6366f1" opacity="0.12">
    <animate attributeName="opacity" values="0.12;0.22;0.12" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="810" cy="540" r="120" fill="#ec4899" opacity="0.10">
    <animate attributeName="opacity" values="0.10;0.20;0.10" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Eyebrow with animated waving hand -->
  <g transform="translate(62,70)">
    <g>
      <text x="12" y="0" font-size="24" text-anchor="middle" fill="#fbbf24">&#128075;</text>
      <animateTransform attributeName="transform" type="rotate"
        values="0 12 -6; 20 12 -6; -10 12 -6; 20 12 -6; 0 12 -6"
        keyTimes="0;0.25;0.5;0.75;1" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <text x="34" y="0" class="eyebrow" fill="#94a3b8">WELCOME TO MY PROFILE!</text>
  </g>

  <!-- Headline -->
  <text x="60" y="146" class="headline" fill="url(#headline)" filter="url(#glow)">Life is good,</text>
  <text x="60" y="204" class="headline" fill="url(#headline)" filter="url(#glow)">you should <tspan font-style="italic">Git</tspan> one!<tspan class="blink" fill="#22d3ee" dx="6">_</tspan></text>

  <rect x="60" y="240" width="780" height="2" rx="1" fill="#334155" opacity="0.7"/>

  <!-- ============ AI AGENT ORCHESTRATION BAND ============ -->
  <!-- Connecting data-flow lines between agents (Grok-style) -->
  <g stroke-linecap="round" fill="none">
    <path d="M170 300 H310" stroke="#a855f7" stroke-width="2" opacity="0.5"
          stroke-dasharray="4 8">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M330 300 H470" stroke="#22d3ee" stroke-width="2" opacity="0.5"
          stroke-dasharray="4 8">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M490 300 H630" stroke="#3b82f6" stroke-width="2" opacity="0.5"
          stroke-dasharray="4 8">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M650 300 H790" stroke="#22c55e" stroke-width="2" opacity="0.5"
          stroke-dasharray="4 8">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 5 pixel-bot agents drifting left/right -->
  <g transform="translate(140,286)"><g class="agent a1"><g class="bob"><use href="#bot" fill="#a855f7" filter="url(#neon)"/></g></g></g>
  <g transform="translate(300,286)"><g class="agent a2"><g class="bob"><use href="#bot" fill="#22d3ee" filter="url(#neon)"/></g></g></g>
  <g transform="translate(460,286)"><g class="agent a3"><g class="bob"><use href="#bot" fill="#3b82f6" filter="url(#neon)"/></g></g></g>
  <g transform="translate(620,286)"><g class="agent a4"><g class="bob"><use href="#bot" fill="#22c55e" filter="url(#neon)"/></g></g></g>
  <g transform="translate(780,286)"><g class="agent a5"><g class="bob"><use href="#bot" fill="#f472b6" filter="url(#neon)"/></g></g></g>

  <!-- Status line -->
  <text x="450" y="352" class="status" text-anchor="middle">
    <tspan fill="#22d3ee">&#9679;</tspan> Thinking agents
    <tspan class="blink" fill="#94a3b8">&#8230;</tspan>
  </text>

  <!-- ================= ICON ROW (smaller chips) ================= -->
  <!-- Order: AWS, AI, Kiro, Python, TS, Databases -->
  <!-- Each chip is 96x96; inner artwork authored at 118 scale then scaled 0.8136 -->

  <!-- AWS -->
  <g transform="translate(60,392)">
    <g class="float d1">
      <rect width="96" height="96" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5" filter="url(#chipglow)"/>
      <g transform="scale(0.8136)">
        <g class="pulse">
          <text class="aws" x="59" y="56" text-anchor="middle" fill="#FF9900">aws</text>
          <path d="M28 66 q31 20 62 0" stroke="#FF9900" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M84 62 l7 3 l-2 7" stroke="#FF9900" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <text x="59" y="112" class="label" text-anchor="middle">AWS</text>
      </g>
    </g>
  </g>

  <!-- AI -->
  <g transform="translate(196,392)">
    <g class="float d2">
      <rect width="96" height="96" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5" filter="url(#chipglow)"/>
      <g transform="scale(0.8136)">
        <g class="pulse" transform="translate(59,50)">
          <circle cx="0" cy="0" r="8" fill="#34d399"/>
          <g stroke="#34d399" stroke-width="3" fill="none">
            <line x1="0" y1="-8" x2="0" y2="-24"/><line x1="0" y1="8" x2="0" y2="24"/>
            <line x1="-8" y1="0" x2="-24" y2="0"/><line x1="8" y1="0" x2="24" y2="0"/>
            <line x1="6" y1="-6" x2="16" y2="-16"/><line x1="-6" y1="6" x2="-16" y2="16"/>
          </g>
          <g fill="#a7f3d0">
            <circle cx="0" cy="-24" r="4"><animate attributeName="r" values="4;6;4" dur="1.8s" repeatCount="indefinite"/></circle>
            <circle cx="0" cy="24"  r="4"><animate attributeName="r" values="4;6;4" dur="2.1s" repeatCount="indefinite"/></circle>
            <circle cx="-24" cy="0" r="4"><animate attributeName="r" values="4;6;4" dur="1.5s" repeatCount="indefinite"/></circle>
            <circle cx="24" cy="0"  r="4"><animate attributeName="r" values="4;6;4" dur="2.4s" repeatCount="indefinite"/></circle>
            <circle cx="16" cy="-16" r="3.5"><animate attributeName="r" values="3.5;5.5;3.5" dur="1.9s" repeatCount="indefinite"/></circle>
            <circle cx="-16" cy="16" r="3.5"><animate attributeName="r" values="3.5;5.5;3.5" dur="2.2s" repeatCount="indefinite"/></circle>
          </g>
        </g>
        <text x="59" y="112" class="label" text-anchor="middle">AI</text>
      </g>
    </g>
  </g>

  <!-- Kiro (friendly ghost mark) -->
  <g transform="translate(332,392)">
    <g class="float d3">
      <rect width="96" height="96" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5" filter="url(#chipglow)"/>
      <g transform="scale(0.8136)">
        <g class="pulse" transform="translate(59,48)">
          <!-- ghost body with wavy bottom -->
          <path d="M-22 6
                   a22 26 0 0 1 44 0
                   V22
                   l-7 8 l-7 -8 l-7 8 l-7 -8 l-7 8 l-2 -3 Z"
                fill="#a78bfa" stroke="#c4b5fd" stroke-width="1.5" stroke-linejoin="round"/>
          <!-- eyes -->
          <circle cx="-8" cy="-2" r="4.5" fill="#0b1120"/>
          <circle cx="9"  cy="-2" r="4.5" fill="#0b1120"/>
          <circle cx="-6.5" cy="-3.5" r="1.6" fill="#ffffff"/>
          <circle cx="10.5" cy="-3.5" r="1.6" fill="#ffffff"/>
          <!-- sparkle -->
          <path d="M20 -20 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 Z" fill="#f0abfc">
            <animateTransform attributeName="transform" type="scale"
              values="1;1.3;1" dur="2s" repeatCount="indefinite" additive="sum"/>
          </path>
        </g>
        <text x="59" y="112" class="label" text-anchor="middle">Kiro</text>
      </g>
    </g>
  </g>

  <!-- Python -->
  <g transform="translate(468,392)">
    <g class="float d4">
      <rect width="96" height="96" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5" filter="url(#chipglow)"/>
      <g transform="scale(0.8136)">
        <g class="pulse" transform="translate(30,18)">
          <path d="M29 0 C13 0 14 7 14 7 l0 8 l15 0 l0 3 l-21 0 C0 18 2 32 8 32 l6 0 l0 -9 c0 -6 5 -9 10 -9 l14 0 c5 0 8 -4 8 -9 l0 -8 C46 3 44 0 29 0 z M20 5 a3 3 0 1 1 0 0.1 z" fill="#3776AB"/>
          <path d="M29 58 C45 58 44 51 44 51 l0 -8 l-15 0 l0 -3 l21 0 C58 40 56 26 50 26 l-6 0 l0 9 c0 6 -5 9 -10 9 l-14 0 c-5 0 -8 4 -8 9 l0 8 C12 55 14 58 29 58 z M38 53 a3 3 0 1 1 0 -0.1 z" fill="#FFD43B"/>
        </g>
        <text x="59" y="112" class="label" text-anchor="middle">Python</text>
      </g>
    </g>
  </g>

  <!-- TypeScript -->
  <g transform="translate(604,392)">
    <g class="float d5">
      <rect width="96" height="96" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5" filter="url(#chipglow)"/>
      <g transform="scale(0.8136)">
        <g class="pulse" transform="translate(24,16)">
          <rect x="0" y="0" width="70" height="70" rx="12" fill="#3178C6"/>
          <text x="35" y="48" text-anchor="middle" class="ts">TS</text>
        </g>
        <text x="59" y="112" class="label" text-anchor="middle">TypeScript</text>
      </g>
    </g>
  </g>

  <!-- Databases -->
  <g transform="translate(740,392)">
    <g class="float d6">
      <rect width="96" height="96" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5" filter="url(#chipglow)"/>
      <g transform="scale(0.8136)">
        <g class="pulse" transform="translate(59,52)">
          <g fill="#38bdf8" stroke="#7dd3fc" stroke-width="2">
            <!-- three stacked disks -->
            <path d="M-24 -22 v10 a24 8 0 0 0 48 0 v-10 a24 8 0 0 0 -48 0 Z"/>
            <path d="M-24 -6 v10 a24 8 0 0 0 48 0 v-10" fill="#0ea5e9"/>
            <path d="M-24 10 v10 a24 8 0 0 0 48 0 v-10" fill="#0284c7"/>
            <ellipse cx="0" cy="-22" rx="24" ry="8" fill="#7dd3fc"/>
          </g>
          <!-- data-flow blip -->
          <circle cx="0" cy="-22" r="3" fill="#e0f2fe">
            <animate attributeName="cy" values="-22;18;-22" dur="2.4s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/>
          </circle>
        </g>
        <text x="59" y="112" class="label" text-anchor="middle">Databases</text>
      </g>
    </g>
  </g>

</svg>
